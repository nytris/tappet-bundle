tappet_api_load_fixtures:
    path: '/.well-known/tappet/fixture/{fixtureClass}'
    methods: ['POST']
    controller: Tappet\Bundle\Controller\Api\FixtureController::loadAction

tappet_api_load_multiple_fixtures:
    path: '/.well-known/tappet/fixtures'
    methods: ['POST']
    controller: Tappet\Bundle\Controller\Api\FixtureController::loadMultipleAction

tappet_api_purge_fixtures:
    path: '/.well-known/tappet/fixtures'
    methods: ['DELETE']
    controller: Tappet\Bundle\Controller\Api\FixtureController::purgeAction

tappet_api_fetch_remote_state:
    path: '/.well-known/tappet/remote-state/{handle}'
    methods: ['GET']
    controller: Tappet\Bundle\Controller\Api\RemoteStateController::fetchAction
